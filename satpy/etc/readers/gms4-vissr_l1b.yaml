reader:
  name: gms4-vissr_l1b
  short_name: GMS-1..4 VISSR L1b
  long_name: GMS-1/2/3/4 VISSR L1b Data
  description: >
    Reader for GMS-1 through GMS-4 Level 1b data. References:

    - https://www.data.jma.go.jp/mscweb/en/operation/fig/VISSR_FORMAT_GMS-4.pdf
    - https://www.data.jma.go.jp/mscweb/en/operation/fig/GMS_Users_Guide_3rd_Edition_Rev1.pdf

  status: Alpha
  supports_fsspec: true
  sensors: [gms4-vissr]
  reader: !!python/name:satpy.readers.core.yaml_reader.FileYAMLReader

file_types:
    gms4_vissr_vis:
        file_reader: !!python/name:satpy.readers.gms.gms4_vissr_l1b.GmsVissrFileHandler
        file_patterns:
        - 'VS{start_time:%y%m%d}.{mode}'
        - 'VS{start_time:%y%m%d}.{mode}.gz'

    gms4_vissr_ir:
        file_reader: !!python/name:satpy.readers.gms.gms4_vissr_l1b.GmsVissrFileHandler
        file_patterns:
        - 'IR{start_time:%y%m%d}.{mode}'
        - 'IR{start_time:%y%m%d}.{mode}.gz'

datasets:
  VIS:
    name: VIS
    sensor: gms4-vissr
    wavelength: [0.55, 0.73, 0.9]
    resolution: 1250
    calibration:
      counts:
        standard_name: counts
        units: 1
      unnormalized_reflectance:
        standard_name: product_of_cosine_solar_zenith_angle_and_toa_bidirectional_reflectance
        units: "%"
    file_type: gms4_vissr_vis

  IR:
    name: IR
    sensor: gms4-vissr
    wavelength: [10.5, 11.0, 11.5]
    resolution: 5000
    calibration:
      counts:
        standard_name: counts
        units: 1
      brightness_temperature:
        standard_name: toa_brightness_temperature
        units: K
    file_type: gms4_vissr_ir
