reader:
  name: uvns_new
  short_name: uvns_new
  long_name: Metadata-driven UVNS reader
  description: Sentinel-4 and Sentinel-5 UVNS Level 1 and Level 2 reader
  status: Beta
  supports_fsspec: false
  reader: !!python/name:satpy.readers.core.yaml_reader.FileYAMLReader
  sensors:
    - uvn
    - uvns

file_types:
  uvn:
    file_reader: !!python/name:satpy.readers.uvns_new.UVNSFileHandler
    file_patterns:
      - '{filename:s}.nc'