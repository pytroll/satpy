  # NOTE: no separate VAS_CH13 dataset -- per the McIDAS-X User's
  # Guide VAS channel table, channel 13 is documented as "the same as
  # band 8 but at lower resolution," not an independent physical
  # channel, so it isn't exposed as its own named dataset here. If a
  # Dwell Sounding (or other) file's band list ever reports channel 13
  # in a band slot, read_channel(13)/read_ir_temperature_aaa(13)
  # still work (they transparently borrow channel 8's calibration --
  # see goes_pregvar_format.py) -- there's just no YAML entry wired up
  # to request it by name yet.
