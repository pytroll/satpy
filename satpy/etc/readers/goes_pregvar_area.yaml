reader:
  name: goes_pregvar_area
  short_name: GOES pre-GVAR AREA
  long_name: SMS/GOES 1-7 VISSR/VAS McIDAS AREA files
  description: >
    Reader for pre-GVAR McIDAS AREA files from SMS and GOES 1-7.
  status: Alpha
  supports_fsspec: false
  sensors: [goes_pregvar]
  reader: !!python/name:satpy.readers.core.yaml_reader.FileYAMLReader

file_types:
  area_ir:
    file_reader: !!python/name:satpy.readers.goes_pregvar.goes_pregvar_area.GOESPreGVARAreaFileHandler
    file_patterns:
      - '{platform}{sat_num:2d}.{year:4d}.{doy:3d}.{hhmm:4d}.AREA_IR'
      - '{platform}{sat_num:2d}.{year:4d}.{doy:3d}.{hhmm:4d}-{seq_num:1d}.AREA_IR'
  area_vis:
    file_reader: !!python/name:satpy.readers.goes_pregvar.goes_pregvar_area.GOESPreGVARAreaFileHandler
    file_patterns:
      - '{platform}{sat_num:2d}.{year:4d}.{doy:3d}.{hhmm:4d}.AREA_VIS'
      - '{platform}{sat_num:2d}.{year:4d}.{doy:3d}.{hhmm:4d}-{seq_num:1d}.AREA_VIS'

datasets:
  longitude:
    name: longitude
    file_type: [area_ir, area_vis]
    standard_name: longitude
    units: degrees_east

  latitude:
    name: latitude
    file_type: [area_ir, area_vis]
    standard_name: latitude
    units: degrees_north

  VIS:
    name: VIS
    band: VIS
    sensor: goes_pregvar
    wavelength: [0.55, 0.65, 0.75]
    resolution: 900
    file_type: [area_vis]
    coordinates: [longitude, latitude]
    calibration:
      counts:
        standard_name: counts
        units: "1"
      unnormalized_reflectance:
        standard_name: product_of_cosine_solar_zenith_angle_and_toa_bidirectional_reflectance
        units: "%"

  IR:
    name: IR
    band: IR
    sensor: goes_pregvar
    wavelength: [10.5, 11.5, 12.5]
    resolution: 6900
    file_type: [area_ir]
    coordinates: [longitude, latitude]
    calibration:
      brightness_temperature:
        standard_name: toa_brightness_temperature
        units: K
      counts:
        standard_name: counts
        units: "1"

  VAS_CH1:
    name: VAS_CH1
    band: IR
    vas_channel: 1
    description: "CO2 temperature sounding, ~70mb"
    wavelength: [14.2, 14.7, 15.2]
    resolution: 13800
    sensor: goes_pregvar
    file_type: [area_ir]
    coordinates: [longitude, latitude]
    calibration:
      brightness_temperature:
        standard_name: toa_brightness_temperature
        units: K
      radiance:
        standard_name: toa_outgoing_radiance_per_unit_wavenumber
        units: mW m-2 sr-1 (cm-1)-1
      counts:
        standard_name: counts
        units: "1"

  VAS_CH2:
    name: VAS_CH2
    band: IR
    vas_channel: 2
    description: "CO2 temperature sounding, ~125mb"
    wavelength: [14.0, 14.5, 15.0]
